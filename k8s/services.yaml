apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: interview-hub-ns1
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: interview-hub-ns1
spec:
  selector:
    app: core
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: calendar-service
  namespace: interview-hub-ns1
spec:
  selector:
    app: calendar-service
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: interview-hub-ns1
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: interview-hub-ns1
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    # Management UI (15672) intentionally NOT exposed as a Service port for security.
    # For debugging, use: kubectl port-forward -n interview-hub-ns1 svc/rabbitmq 15672:15672
    # or: kubectl port-forward -n interview-hub-ns1 pod/<rabbitmq-pod-name> 15672:15672
