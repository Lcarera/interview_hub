apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: interview-hub-ns1
spec:
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: core
  namespace: interview-hub-ns1
spec:
  selector:
    app: core
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: calendar-service
  namespace: interview-hub-ns1
spec:
  selector:
    app: calendar-service
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: interview-hub-ns1
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
