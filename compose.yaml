services:
  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    image: api-gateway:0.0.1-SNAPSHOT
    ports:
      - "8080:8080"
    environment:
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      CORE_URL: http://app:8082
    env_file:
      - path: .env
        required: false
    depends_on:
      app:
        condition: service_started

  notification-service:
    image: notification-service:0.0.1-SNAPSHOT
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@lcarera.dev}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    depends_on:
      rabbitmq:
        condition: service_healthy

  calendar-service:
    image: calendar-service:0.0.1-SNAPSHOT
    ports:
      - "8082:8082"
    environment:
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-primary}
      GOOGLE_CALENDAR_REFRESH_TOKEN: ${GOOGLE_CALENDAR_REFRESH_TOKEN}
    env_file:
      - path: .env
        required: false

  app:
    image: interview-hub:0.0.1-SNAPSHOT
    environment:
      SERVER_PORT: 8082
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      CALENDAR_SERVICE_URL: http://calendar-service:8082
    env_file:
      - path: .env
        required: false
    depends_on:
      rabbitmq:
        condition: service_healthy
      calendar-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NG_CONFIG: docker
    ports:
      - "80:80"
    depends_on:
      - api-gateway
