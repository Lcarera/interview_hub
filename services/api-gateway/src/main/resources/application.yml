server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: core-auth
          uri: ${CORE_URL:http://localhost:8082}
          predicates:
            - Path=/auth/**
        - id: core-actuator
          uri: ${CORE_URL:http://localhost:8082}
          predicates:
            - Path=/actuator/**
        - id: core-default
          uri: ${CORE_URL:http://localhost:8082}
          predicates:
            - Path=/**

app:
  jwt:
    signing-secret: ${JWT_SIGNING_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health, info
